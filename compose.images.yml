services:
  postgres:
    image: postgres:17-alpine
    container_name: job-collector-postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Seoul}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: ${BACKEND_IMAGE:-job-collector-backend:local}
    command: ["migrate"]
    env_file: ${ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ${BACKEND_IMAGE:-job-collector-backend:local}
    container_name: job-collector-api
    command: ["api"]
    env_file: ${ENV_FILE:-.env}
    restart: unless-stopped
    expose: ["8000"]
    ports:
      - "${API_EXTERNAL_PORT:-18000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 5

  scheduler:
    image: ${BACKEND_IMAGE:-job-collector-backend:local}
    container_name: job-collector-scheduler
    command: ["scheduler"]
    env_file: ${ENV_FILE:-.env}
    environment:
      SCHEDULER_ENABLED: "true"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  dashboard:
    image: ${DASHBOARD_IMAGE:-job-collector-dashboard:local}
    container_name: job-collector-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
