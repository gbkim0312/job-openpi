server { listen 80; root /usr/share/nginx/html; index index.html; location /api/ { proxy_pass http://api:8000/api/; } location /health { proxy_pass http://api:8000/health; } location /docs { proxy_pass http://api:8000/docs; } location /redoc { proxy_pass http://api:8000/redoc; } location /openapi.json { proxy_pass http://api:8000/openapi.json; } location / { try_files $uri $uri/ /index.html; } }
