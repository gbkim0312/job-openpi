[project]
name = "job-collector"
version = "0.1.0"
description = "Normalized job posting collector and OpenAPI server"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.34", "pydantic>=2.10",
  "pydantic-settings>=2.7", "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.30",
  "alembic>=1.14", "aiosqlite>=0.20", "psycopg[binary]>=3.2", "httpx>=0.28", "beautifulsoup4>=4.12", "lxml>=5.3",
  "apscheduler>=3.11", "tenacity>=9.0", "structlog>=24.4", "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "respx>=0.22", "ruff>=0.9"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint.per-file-ignores]
"src/job_collector/adapter/inbound/http/app.py" = ["B008"]
